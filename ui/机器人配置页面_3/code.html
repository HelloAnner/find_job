<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI助手与消息模板</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3994ef",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 240px;
            background-color: #111418;
            color: #fff;
            text-align: left;
            border-radius: 0.5rem;
            padding: 8px 12px;
            position: absolute;
            z-index: 1;
            bottom: 150%;
            left: 50%;
            margin-left: -120px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: normal;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #111418 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-8 md:px-16 lg:px-24 xl:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1 gap-8">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f2f4] dark:border-b-white/10 px-4 sm:px-6 md:px-10 py-3 bg-white dark:bg-background-dark rounded-xl sticky top-4 z-10 shadow-sm">
<div class="flex items-center gap-4 text-[#111418] dark:text-white">
<div class="size-6 text-primary">
<svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"></path>
</svg>
</div>
<h1 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">自动化找工作机器人</h1>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">保存配置</span>
</button>
</header>
<main class="flex flex-col gap-8">
<div class="flex flex-wrap justify-between gap-3 p-4">
<div class="flex min-w-72 flex-col gap-3">
<p class="text-[#111418] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">AI助手与消息模板</p>
<p class="text-[#617589] dark:text-slate-400 text-base font-normal leading-normal">配置AI助手的沟通方式和投递成功后的消息模板</p>
</div>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<h2 class="text-[#111418] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-2 border-b border-slate-200 dark:border-white/10">AI 助手配置</h2>
<div class="flex flex-col gap-6 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">AI助手自我介绍</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">这是您在与HR或招聘方初次沟通时使用的自我介绍。AI会参考这段内容来生成个性化消息。</span>
</div>
</div>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary min-h-32 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="例如：您好，我是一位拥有3年经验的前端开发者，擅长使用React和Vue框架..."></textarea>
</label>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">自定义 Prompt</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">为AI提供特定的指令，以指导它如何为您撰写或优化内容。留空则使用默认配置。</span>
</div>
</div>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary min-h-32 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="例如：请以热情、专业的语气撰写求职信，并强调我的项目经验..."></textarea>
</label>
</div>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<h2 class="text-[#111418] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-2 border-b border-slate-200 dark:border-white/10">消息模板配置</h2>
<div class="flex flex-col gap-6 px-4 py-3">
<div class="flex items-center gap-4 bg-transparent min-h-14 justify-between">
<div class="flex items-center gap-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal flex-1 truncate">投递成功后自动发送消息</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">启用后，机器人将在简历投递成功后，自动向招聘方发送一条预设的消息。</span>
</div>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f2f4] dark:bg-slate-800 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 6px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">消息模板</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">自定义投递成功后发送的消息内容。您可以使用 {职位名称} 和 {公司名称} 作为占位符。</span>
</div>
</div>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary min-h-32 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="您好，我对贵公司发布的 {职位名称} 职位非常感兴趣。我的技能和经验与该职位的要求高度匹配，期待能有机会进一步沟通。">您好，我对贵公司发布的 {职位名称} 职位非常感兴趣，已投递简历。我的经验与该岗位要求非常匹配，希望能获得面试机会，谢谢！</textarea>
</label>
</div>
</div>
<div class="flex flex-col sm:flex-row items-center justify-end gap-4 p-4 mt-4">
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-transparent text-[#617589] dark:text-slate-400 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="truncate">重置为默认</span>
</button>
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">保存配置</span>
</button>
</div>
</main>
</div>
</div>
</div>
</div>

</body></html>
