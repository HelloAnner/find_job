<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>高级行为设置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3994ef",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 220px;
            background-color: #111418;
            color: #fff;
            text-align: left;
            border-radius: 0.5rem;
            padding: 8px 12px;
            position: absolute;
            z-index: 1;
            bottom: 150%;
            left: 50%;
            margin-left: -110px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: normal;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #111418 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-8 md:px-16 lg:px-24 xl:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1 gap-8">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f2f4] dark:border-b-white/10 px-4 sm:px-6 md:px-10 py-3 bg-white dark:bg-background-dark rounded-xl sticky top-4 z-10 shadow-sm">
<div class="flex items-center gap-4 text-[#111418] dark:text-white">
<div class="size-6 text-primary">
<svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"></path>
</svg>
</div>
<h1 class="text-[#111418] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">自动化找工作机器人</h1>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">保存配置</span>
</button>
</header>
<main class="flex flex-col gap-8">
<div class="flex flex-wrap justify-between gap-3 p-4">
<div class="flex min-w-72 flex-col gap-3">
<p class="text-[#111418] dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">高级行为设置</p>
<p class="text-[#617589] dark:text-slate-400 text-base font-normal leading-normal">调整机器人运行的各项高级参数，以实现更精细的控制</p>
</div>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<div class="flex flex-col gap-6">
<div class="flex items-center gap-4 bg-transparent px-4 min-h-14 justify-between border-b border-slate-200 dark:border-slate-800 pb-6">
<div class="flex items-center gap-4">
<div class="text-[#111418] dark:text-white flex items-center justify-center rounded-lg bg-[#f0f2f4] dark:bg-slate-800 shrink-0 size-10">
<span class="material-symbols-outlined">bug_report</span>
</div>
<div class="flex items-center gap-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal flex-1 truncate">调试模式</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">开启后，机器人将以可视化的方式运行，方便您观察其行为并进行调试。</span>
</div>
</div>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f2f4] dark:bg-slate-800 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 6px;"></div>
<input class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-8 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">窗口开启方式</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择机器人在运行时是否显示浏览器窗口。</span>
</div>
</div>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-14 placeholder:text-[#617589] px-[15px] text-base font-normal leading-normal">
<option>显示窗口</option>
<option>后台静默运行</option>
</select>
<div class="pointer-events-none text-[#617589] dark:text-slate-400 absolute right-0 flex h-full items-center justify-center pr-[15px]">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">投递间隔时间 (秒)</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">设置每次投递操作之间的随机等待时间范围，模拟人类行为，避免被平台检测。</span>
</div>
</div>
<div class="flex items-center gap-2">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-14 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="最短" type="number" value="5"/>
<span class="text-[#617589] dark:text-slate-400">-</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-14 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="最长" type="number" value="15"/>
</div>
</label>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">每日最大投递次数</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">设置机器人每天最多投递的职位数量，以避免账户被平台限制。</span>
</div>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-14 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="例如：100" type="number" value="100"/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">图片简历文件路径</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">如果需要以图片形式发送简历，请在此处填写图片的本地文件路径。</span>
</div>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-14 placeholder:text-[#617589] p-[15px] text-base font-normal leading-normal" placeholder="例如：C:\Users\YourName\resume.png" value=""/>
</label>
</div>
<div class="flex items-center gap-4 bg-transparent px-4 min-h-14 justify-between border-t border-slate-200 dark:border-slate-800 pt-6">
<div class="flex items-center gap-4">
<div class="text-[#111418] dark:text-white flex items-center justify-center rounded-lg bg-[#f0f2f4] dark:bg-slate-800 shrink-0 size-10">
<span class="material-symbols-outlined">person_off</span>
</div>
<div class="flex items-center gap-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal flex-1 truncate">过滤不活跃的HR</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">启用后，机器人将自动跳过那些长期未登录或不活跃的HR发布的职位。</span>
</div>
</div>
</div>
<div class="shrink-0">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f2f4] dark:bg-slate-800 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 6px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
</div>
</div>
<div class="flex flex-col sm:flex-row items-center justify-end gap-4 p-4 mt-4">
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-transparent text-[#617589] dark:text-slate-400 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="truncate">重置为默认</span>
</button>
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">保存配置</span>
</button>
</div>
</main>
</div>
</div>
</div>
</div>

</body></html>
