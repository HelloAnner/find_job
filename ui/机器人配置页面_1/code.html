<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>基本投递设置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3994ef",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 240px;
            background-color: #111418;
            color: #fff;
            text-align: left;
            border-radius: 0.5rem;
            padding: 8px 12px;
            position: absolute;
            z-index: 1;
            bottom: 150%;
            left: 50%;
            margin-left: -120px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 14px;
            font-weight: normal;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #111418 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 sm:px-8 md:px-16 lg:px-24 xl:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1 gap-8">
<main class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<h1 class="text-[#111418] dark:text-white text-3xl font-bold leading-tight tracking-[-0.02em]">基本投递设置</h1>
<p class="text-[#617589] dark:text-slate-400 text-base font-normal leading-normal">在这里自定义您的自动化机器人行为和参数，精准匹配职位。</p>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-2 border-b border-slate-200 dark:border-white/10">职位偏好</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-6 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">职位名称/关键词</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">输入您期望的职位名称或关键词，用逗号分隔，例如 "前端开发, React"。</span>
</div>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] p-3 text-base font-normal leading-normal" placeholder="例如：前端开发, React, Vue" value=""/>
</label>
<div class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">关键词扩展</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">启用后，机器人将自动扩展您的关键词，寻找更多相关职位。</span>
</div>
</div>
<div class="flex items-center gap-4 h-12">
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-[#f0f2f4] dark:bg-slate-800 p-0.5 has-[:checked]:justify-end has-[:checked]:bg-primary">
<div class="h-full w-[27px] rounded-full bg-white transition-transform" style="box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 6px;"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
<span class="text-[#617589] dark:text-slate-400 text-sm">启用智能扩展</span>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-2 border-b border-slate-200 dark:border-white/10">求职要求</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-6 px-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">地域</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择您希望工作的城市，可多选。</span>
</div>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] p-3 text-base font-normal leading-normal" placeholder="例如：北京, 上海, 深圳" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">经验</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择您期望的职位工作经验要求。</span>
</div>
</div>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] px-3 text-base font-normal leading-normal">
<option>不限</option>
<option>在校/应届</option>
<option>1-3年</option>
<option>3-5年</option>
<option>5-10年</option>
</select>
<div class="pointer-events-none text-[#617589] dark:text-slate-400 absolute right-0 flex h-full items-center justify-center pr-3">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<div class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">薪资 (千/月)</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">设置您期望的月薪范围，单位为千元（k）。留空表示不限。</span>
</div>
</div>
<div class="flex items-center gap-2">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] p-3 text-base font-normal leading-normal" placeholder="最低" type="number"/>
<span class="text-[#617589] dark:text-slate-400">-</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] p-3 text-base font-normal leading-normal" placeholder="最高" type="number"/>
</div>
</div>
<label class="flex flex-col min-w-40 flex-1">
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">学历</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择职位要求的最低学历。</span>
</div>
</div>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111418] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary dark:focus:border-primary h-12 placeholder:text-[#617589] px-3 text-base font-normal leading-normal">
<option>不限</option>
<option>大专</option>
<option>本科</option>
<option>硕士</option>
<option>博士</option>
</select>
<div class="pointer-events-none text-[#617589] dark:text-slate-400 absolute right-0 flex h-full items-center justify-center pr-3">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
</div>
</div>
<div class="flex flex-col gap-4 bg-white dark:bg-slate-900/70 p-6 rounded-xl border border-transparent dark:border-white/10 shadow-sm">
<h2 class="text-[#111418] dark:text-white text-xl font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-2 border-b border-slate-200 dark:border-white/10">公司偏好</h2>
<div class="px-4 py-3">
<div class="flex flex-col gap-6">
<div>
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">公司规模</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择您偏好的公司员工数量规模，可多选。</span>
</div>
</div>
<div class="flex flex-wrap gap-4 pt-2">
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">0-20人</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input checked="" class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">20-99人</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input checked="" class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">100-499人</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">500-999人</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">1000人以上</span></label>
</div>
</div>
<div>
<div class="flex items-center gap-2 pb-2">
<p class="text-[#111418] dark:text-white text-base font-medium leading-normal">融资阶段</p>
<div class="tooltip">
<span class="material-symbols-outlined text-[#617589] dark:text-slate-400 cursor-help" style="font-size: 18px;">help_outline</span>
<span class="tooltiptext">选择您偏好的公司融资阶段，可多选。</span>
</div>
</div>
<div class="flex flex-wrap gap-4 pt-2">
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">未融资</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">天使轮</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input checked="" class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">A/B/C轮</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">D轮及以上</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">已上市</span></label>
<label class="flex items-center gap-2 cursor-pointer"><input class="form-checkbox h-5 w-5 rounded text-primary bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 focus:ring-primary" type="checkbox"/><span class="text-[#111418] dark:text-white text-base">不需要融资</span></label>
</div>
</div>
</div>
</div>
</div>
<div class="flex flex-col sm:flex-row items-center justify-end gap-4 p-4 mt-4">
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-transparent text-[#617589] dark:text-slate-400 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="truncate">重置</span>
</button>
<button class="flex w-full sm:w-auto min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-11 px-6 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
<span class="truncate">保存设置</span>
</button>
</div>
</main>
</div>
</div>
</div>
</div>

</body></html>
