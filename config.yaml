# 放宽匹配标准：只要是兼职/项目制且与专业相关（或技能可迁移）即可
boss:
  debugger: false
  openWindows: false
  sayHi: "您好，我是一名博士，在人工智能领域有丰富的科研和论文发表经验。我擅长将复杂的理论问题拆解，并提供清晰的指导，无论是课题选择、实验设计，还是论文写作，都能为您提供专业的支持。"
  # 关键词扩展，覆盖兼职/项目制、学术指导、企业培训与AI相关职位
  keywords: [
    "SCI辅导", "SCI论文","顶会论文", 
    "留学生辅导", "CS课程辅导", "人工智能导师", "科研项目指导",
    "大模型企业应用", "AI企业内训"
  ]
  industry: [ "不限" ]
  cityCode: [ "全国" ]
  # 放宽经验要求，允许在校/应届与更高年限
  experience: [ "不限" ]
  jobType: "兼职"
  salary: ""
  # 放宽学历要求，专业对口即可
  degree: ["硕士", "博士" ]
  scale: [ "不限" ]
  stage: [ "不限" ]
  # 放宽期望薪资范围（3K-60K）
  expectedSalary: [ 3, 60 ]
  waitTime: 10
  filterDeadHR: true
  enableAI: true
  interval: 2
  # 增加投递次数以扩大覆盖面
  max: 50
  sendImgResume: false
  deadStatus: [ "2周内活跃","本月活跃" ]

ai:
  introduce: "我拥有人工智能领域的博士学位，具备深厚的学术背景和系统的研究方法论。我不仅独立完成并发表过多篇高水平（顶会/SCI）论文，还非常熟悉从课题设计、理论研究、实验验证到论文撰写和发表的全过程。我致力于将复杂的AI理论知识转化为实践能力，能够为学生（包括留学生）提供精准的学业与论文指导，也能为企业提供AI相关的技术内训和项目咨询。期待以学术顾问、项目指导或兼职讲师的角色，助您实现目标。"
  # 进一步放宽生成招呼语条件：只要是兼职/项目制，且与AI、科研、教学、指导等能力沾边即可
  prompt: "我目前在寻求学术指导、论文写作、企业培训、远程教学相关的兼职、顾问或项目合作机会，偏好远程/线上模式。%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,请判断这个职位是否与我的人工智能、博士科研背景、或教学指导能力相关。只要是兼职/项目制，且内容沾边（例如科研、教学、写作、咨询、技术支持等），不强制要求线下办公，就请帮我写一个给对方打招呼的文本发给我; 若确实完全无关再返回false (判断标准非常宽松，有任何技能或知识上的关联即可)，注意只返回所需内容, 文字不超过20词, 突出我的专业背景与问题解决能力及职位匹配度, 我自己写的招呼语是：【%s】, 可按职位适当调整"
bot:
  is_send: true
  template: |
    ## 新投递成功
    - 岗位：{{jobLink}}
    - 公司：{{companyName}}
    - 城市/经验：{{jobArea}}
    - 薪资：{{salary}}
    - 招呼语：{{greeting}}
    - 状态：{{status}}