ai:
    introduce: 我拥有人工智能领域的博士学位，具备深厚的学术背景和系统的研究方法论。我不仅独立完成并发表过多篇高水平（顶会/SCI）论文，还非常熟悉从课题设计、理论研究、实验验证到论文撰写和发表的全过程。我致力于将复杂的AI理论知识转化为实践能力，能够为学生（包括留学生）提供精准的学业与论文指导，也能为企业提供AI相关的技术内训和项目咨询。期待以学术顾问、项目指导或兼职讲师的角色，助您实现目标。
    prompt: 我目前在寻求学术指导、论文写作、企业培训、远程教学相关的兼职、顾问或项目合作机会，偏好远程/线上模式。%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,请判断这个职位是否与我的人工智能、博士科研背景、或教学指导能力相关。只要是兼职/项目制，且内容沾边（例如科研、教学、写作、咨询、技术支持等），不强制要求线下办公，就请帮我写一个给对方打招呼的文本发给我; 若确实完全无关再返回false (判断标准非常宽松，有任何技能或知识上的关联即可)，注意只返回所需内容, 文字不超过20词, 突出我的专业背景与问题解决能力及职位匹配度, 我自己写的招呼语是：【%s】, 必须严格按照我的招呼语输出 , 禁止加任何多余词汇
