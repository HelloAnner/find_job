ai:
    introduce: 你好,  我对贵公司的岗位很感兴趣
    prompt: 我目前在寻求兼职，偏好远程/线上模式 , 不接受工作流开发 , 而是真实的智能体开发gang wei。%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,请判断这个职位是否与我的自我介绍相关，不强制要求线下办公，就请帮我写一个给对方打招呼的文本发给我; 若确实完全无关再返回false ，注意只返回所需内容, 文字不超过20词, 突出我的专业背景与问题解决能力及职位匹配度, 我自己写的招呼语是：【%s】 , 你可以参考一下
boss:
    cityCode:
        - "0"
    customCityCode: {}
    deadStatus:
        - 2周内活跃
        - 本月活跃
    degree:
        - "203"
    enableAI: true
    expectedSalary:
        - 10
        - 60
    experience:
        - "105"
    filterDeadHR: true
    industry:
        - "0"
    interval: 2
    jobType: "1903"
    keywords:
        - 智能体开发
    max: 15
    salary: "0"
    sayHi: 您好，我对这份工作非常感兴趣，希望可以有机会与您进一步沟通。
    scale:
        - "0"
    sendImgResume: false
    stage:
        - "0"
    waitTime: 20
bot:
    is_send: true
    template: |-
        ## 新投递成功
        - 岗位：{{jobLink}}
        - 公司：{{companyName}}
        - 城市/经验：{{jobArea}}
        - 薪资：{{salary}}
        - 招呼语：{{greeting}}
        - 状态：{{status}}
