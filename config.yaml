# 带[ ]括号的，就是多选，不带的就是单选,所有选项的 开对应true，关对应false，自行根据需要调整
boss:
  debugger: false # 开发者模式，默认为false即可
  openWindows: true # 是否开启浏览器窗口，修改为true保持浏览器窗口可见
  sayHi: "您好，我是一位资深AI算法专家，专注于大模型、量化、自动驾驶等前沿领域，期待与您交流。" # 已更新为与您技能匹配的默认招呼语
  keywords: ["人工智能", "大模型算法工程师", "LLM", "量化研究员", "自动驾驶算法工程师", "数据科学家", "自然语言处理"] # 已更新为匹配您新方向的关键词
  industry: [ "不限" ] # 公司行业
  cityCode: [ "全国" ] # 城市：目前支持：全国 北京 上海 杭州 广州 深圳 成都 天津
  experience: [ "3-5年", "5-10年" ] # 【重要】已根据您的资深背景修改
  jobType: "兼职" # 求职类型
  salary: "" # 薪资（单选）：留空以扩大搜索范围
  degree: [  "硕士", "博士" ] # 【重要】已增加硕博学历以匹配高端岗位
  scale: [ "不限" ] # 公司规模
  stage: [ "不限" ] # 融资阶段
  expectedSalary: [ 40, 80 ] # 【请务必修改】根据您的资历，这是一个参考范围(40K-80K)，请根据实际情况修改！
  waitTime: 10 # 每投递一个岗位，等待10秒
  filterDeadHR: true # 过滤不活跃HR
  enableAI: true # 开启AI检测与自动生成打招呼语
  interval: 1
  max: 100 # 每日最大投递次数
  sendImgResume: false # 是否发送图片简历
  deadStatus: [ "2周内活跃","本月活跃" ] # 只投递近期活跃的HR，提高效率

ai:
  # 【核心修改】已根据您提供的最新技能方向重写，让AI更好地理解您的专家背景
  introduce: "我是一位专注于人工智能领域的专家，擅长方向广泛，涵盖大语言模型(LLM)及其在金融量化的应用、扩散模型、自然语言处理(NLP)。在应用层面，我对具身智能、自动驾驶和通信系统有深入研究和实践。此外，我在机器学习、深度学习、数据分析、数据挖掘和大数据技术栈上拥有扎实的理论基础和丰富的项目经验。"
  prompt: "我目前在找工作,%s,我期望的的岗位方向是【%s】,目前我需要投递的岗位名称是【%s】,这个岗位的要求是【%s】,如果这个岗位和我的期望与经历基本符合，注意是基本符合，那么请帮我写一个给HR打招呼的文本发给我，如果这个岗位和我的期望经历完全不相干，直接返回false给我，注意只要返回我需要的内容即可，不要有其他的语气助词 , 发送的文字不要太多 , 不要是 markdown 格式,限制在20词内的一段话，重点要突出我和岗位的匹配度以及我的优势，我自己写的招呼语是：【%s】,你可以参照我自己写的根据岗位情况进行适当调整"

bot:
  is_send: true #开启企业微信消息推送
  template: |
    ## 新投递成功
    - 岗位：{{jobLink}}
    - 公司：{{companyName}}
    - 城市/经验：{{jobArea}}
    - 薪资：{{salary}}
    - 招呼语：{{greeting}}
    - 状态：{{status}}