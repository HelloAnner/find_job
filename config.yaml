# 带[ ]括号的，就是多选，不带的就是单选,所有选项的 开对应true，关对应false，自行根据需要调整
boss:
  debugger: false # 开发者模式，默认为false即可
  openWindows: true # 是否开启浏览器窗口，修改为true保持浏览器窗口可见
  sayHi: "您好,我有5年开发相关的工作经验,熟悉Golang语言和智能体相关的应用开发" #必须要关闭boss的自动打招呼
  keywords: ["go开发工程师"] # 需要搜索的职位,会依次投递
  industry: [ "不限" ] # 公司行业，只能选三个，相关代码枚举的部分，如果需要其他的需要自己找
  cityCode: [ "全国" ] # 只列举了部分,如果没有的需要自己找：目前支持的：全国 北京 上海 杭州 广州 深圳 成都 天津
  experience: [ "1-3年" ] # 工作经验："应届毕业生", "1年以下", "1-3年", "3-5年", "5-10年", "10年以上"
  jobType: "全职" #求职类型："全职", "兼职"
  salary: "" # 薪资（单选）："3K以下", "3-5K", "5-10K", "10-20K", "20-50K", "50K以上"
  degree: [ "本科" ] # 学历: "初中及以下", "中专/中技", "高中", "大专", "本科", "硕士", "博士"
  scale: [ "不限" ] # 公司规模："0-20人", "20-99人", "100-499人", "500-999人", "1000-9999人", "10000人以上"
  stage: [ "不限" ] # "未融资", "天使轮", "A轮", "B轮", "C轮", "D轮及以上", "已上市", "不需要融资"
  expectedSalary: [ 10,30 ] #期望薪资，单位为K，第一个数字为最低薪资，第二个数字为最高薪资，只填一个数字默认为最低薪水
  waitTime: 10 #每投递一个岗位，等待几秒
  filterDeadHR: true # 是否过滤不活跃HR,该选项会过滤半年前活跃的HR
  enableAI: true # 开启AI检测与自动生成打招呼语
  interval: 1
  max: 10
  sendImgResume: false # 是否发送图片简历
  deadStatus: [ "2周内活跃","本月活跃","2月内活跃","半年前活跃" ] # 过滤掉HR状

ai:
  introduce: "目前我在一家To B 企业在开发 , 主要做 go开发" #这是喂给AI的提示词，主要介绍自己的优势
  prompt: "我目前在找工作,%s,我期望的的岗位方向是【%s】,目前我需要投递的岗位名称是【%s】,这个岗位的要求是【%s】,如果这个岗位和我的期望与经历基本符合，注意是基本符合，那么请帮我写一个给HR打招呼的文本发给我，如果这个岗位和我的期望经历完全不相干，直接返回false给我，注意只要返回我需要的内容即可，不要有其他的语气助词 , 发送的文字不要太多 , 不要是 markdown 格式,限制在20词内的一段话，重点要突出我和岗位的匹配度以及我的优势，我自己写的招呼语是：【%s】,你可以参照我自己写的根据岗位情况进行适当调整" #这是AI的提示词，可以自行修改

bot:
  is_send: true #开启企业微信消息推送
  template: |
    ## 新投递成功
    - 岗位：{{jobLink}}
    - 公司：{{companyName}}
    - 城市/经验：{{jobArea}}
    - 薪资：{{salary}}
    - 招呼语：{{greeting}}
    - 状态：{{status}}