# 带[ ]括号的，就是多选，不带的就是单选,所有选项的 开对应true，关对应false，自行根据需要调整  
boss:  
  debugger: false # 开发者模式，默认为false即可  
  openWindows: false # Docker/服务器模式需关闭窗口，启用无头浏览器  
  # 【核心修改】招呼语已更新为论文辅导的专属版本，强调科研和论文指导能力
  sayHi: "您好，我是一名博士，在人工智能领域有丰富的科研和论文发表经验。我擅长将复杂的理论问题拆解，并提供清晰的指导，无论是课题选择、实验设计，还是论文写作，都能为您提供专业的支持。"
  # 【核心修改】关键词已调整，规避“论文辅导”，采用“科研顾问”等擦边球，精准匹配需求
  keywords: ["科研顾问", "学术顾问", "技术写作", "项目合作", "产学研合作", "远程技术顾问", "技术指导", "课题指导", "数据分析指导", "算法模型指导", "AI项目合作", "人工智能项目", "机器学习项目"]
  industry: [ "不限" ] # 公司行业，对于辅导类工作，不限可以覆盖个人发布者和教育机构  
  cityCode: [ "全国" ] # 城市：线上辅导为主，选择“全国”  
  experience: [ "不限", "1-3年", "3-5年", "5-10年" ] # 已拓宽经验要求，以匹配更多辅导类需求  
  jobType: "兼职" # 求职类型，与您的目标一致  
  salary: "" # 薪资（单选）：留空以扩大搜索范围  
  degree: [  "硕士", "博士" ] # 保留硕博学历，这是您作为辅导者的核心优势  
  scale: [ "不限" ] # 公司规模  
  stage: [ "不限" ] # 融资阶段  
  expectedSalary: [ 5, 30] # 兼职/项目制更实际的范围(5K-30K)，可根据项目复杂度调整  
  waitTime: 10 # 每投递一个岗位，等待10秒  
  filterDeadHR: true # 过滤不活跃HR  
  enableAI: true # 开启AI检测与自动生成打招呼语  
  interval: 2  
  max: 20 # 辅导类岗位较少，可以适当增加投递次数以扩大覆盖面  
  sendImgResume: false # 是否发送图片简历  
  deadStatus: [ "2周内活跃","本月活跃" ] # 只投递近期活跃的HR，提高效率  
  
  
ai:  
  # 【核心修改】AI自我介绍，从“技术专家”转向“学术导师”，突出科研全流程指导能力
  introduce: "我拥有博士学位，在人工智能（包括大模型、自然语言处理等）领域有深厚的学术背景和系统的研究方法论。我不仅独立完成并发表过多篇高水平（顶会/顶刊）论文，还非常熟悉从课题设计、理论研究、实验验证到论文撰写和发表的全过程。我乐于分享我的科研经验，擅长帮助学生和研究人员梳理研究思路、解决关键技术难题、并提升论文质量，期待能以学术顾问或项目指导的角色，助您顺利完成学业或研究目标。"
  prompt: "我目前在寻求人工智能与数据科学领域的兼职、顾问或项目合作机会,%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,如果这个职位和我的技术背景与实践经验基本符合，注意是基本符合，那么请帮我写一个给对方打招呼的文本发给我，如果完全不相干，直接返回false给我 (要求可是适度放宽, 有关联即可投递)，注意只要返回我需要的内容即可，不要有其他的语气助词 , 发送的文字不要太多 , 不要是 markdown 格式,限制在20词内的一段话，重点要突出我的专业背景和解决问题的能力与职位的匹配度，我自己写的招呼语是：【%s】,你可以参照我自己写的根据职位情况进行适当调整"  
  
  
bot:  
  is_send: true #开启企业微信消息推送  
  template: |  
    ## 新投递成功  
    - 岗位：{{jobLink}}  
    - 公司：{{companyName}}  
    - 城市/经验：{{jobArea}}  
    - 薪资：{{salary}}  
    - 招呼语：{{greeting}}  
    - 状态：{{status}}