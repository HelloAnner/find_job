# 带[ ]括号的，就是多选，不带的就是单选,所有选项的 开对应true，关对应false，自行根据需要调整
boss:
  debugger: false # 开发者模式，默认为false即可
  openWindows: false # Docker/服务器模式需关闭窗口，启用无头浏览器
  sayHi: "您好，我是一名博士，具备深厚的学术研究背景和丰富的论文写作与发表经验，擅长人工智能、LLM+金融量化、扩散模型，通信系统、具身智能、自动驾驶、自然语言处理、机器学习、深度学习、大模型、数据分析、数据挖掘、大数据等方向的辅导，希望能为您提供专业的指导。" # 【核心修改】已更新为论文辅导的专属招呼语，请务必填写您的学历和领域！
  keywords: ["技术顾问", "兼职研究员", "算法专家", "高级研究员", "项目合作", "技术合作", "AI顾问", "大模型专家", "外聘专家", "科研顾问", "产学研", "技术指导", "AIGC兼职", "大模型应用", "远程技术顾问", "线上科研顾问", "算法兼职", "技术写作", "企业讲师", "客座研究员"]
  industry: [ "不限" ] # 公司行业，对于辅导类工作，不限可以覆盖个人发布者和教育机构
  cityCode: [ "全国" ] # 城市：线上辅导为主，选择“全国”
  experience: [ "不限", "1-3年", "3-5年", "5-10年" ] # 【重要】已拓宽经验要求，以匹配更多辅导类需求
  jobType: "兼职" # 求职类型，与您的目标一致
  salary: "" # 薪资（单选）：留空以扩大搜索范围
  degree: [  "硕士", "博士" ] # 【重要】保留硕博学历，这是您作为辅导者的核心优势
  scale: [ "不限" ] # 公司规模
  stage: [ "不限" ] # 融资阶段
  expectedSalary: [ 3, 50 ] # 【请务必修改】已调整为兼职/项目制更实际的范围(5K-15K)，您也可以留空 `[ , ]` 以匹配所有薪资范围的岗位！
  waitTime: 10 # 每投递一个岗位，等待10秒
  filterDeadHR: true # 过滤不活跃HR
  enableAI: true # 开启AI检测与自动生成打招呼语
  interval: 1
  max: 150 # 辅导类岗位较少，可以适当增加投递次数以扩大覆盖面
  sendImgResume: false # 是否发送图片简历
  deadStatus: [ "2周内活跃","本月活跃" ] # 只投递近期活跃的HR，提高效率

ai:
  # 【核心修改】AI自我介绍，完全重写以突出学术辅导能力
  introduce: "我拥有博士学位，具备扎实的科研能力和丰富的学术论文写作经验。我的研究方向主要集中在人工智能、LLM+金融量化、扩散模型，通信系统、具身智能、自动驾驶、自然语言处理、机器学习、深度学习、大模型、数据分析、数据挖掘、大数据，并成功在多个顶级期刊/会议上发表论文。我熟悉从课题选择、文献综述、实验设计到论文撰写和投稿的全过程，能够为学生提供全面、专业的指导。"
  prompt: "我目前在寻求论文辅导与科研指导相关的兼职机会,%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,如果这个职位和我的学术背景与辅导能力基本符合，注意是基本符合，那么请帮我写一个给对方打招呼的文本发给我，如果完全不相干，直接返回false给我，注意只要返回我需要的内容即可，不要有其他的语气助词 , 发送的文字不要太多 , 不要是 markdown 格式,限制在20词内的一段话，重点要突出我的学术背景和指导能力与职位的匹配度，我自己写的招呼语是：【%s】,你可以参照我自己写的根据职位情况进行适当调整"

bot:
  is_send: true #开启企业微信消息推送
  template: |
    ## 新投递成功
    - 岗位：{{jobLink}}
    - 公司：{{companyName}}
    - 城市/经验：{{jobArea}}
    - 薪资：{{salary}}
    - 招呼语：{{greeting}}
    - 状态：{{status}}