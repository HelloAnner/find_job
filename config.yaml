# 带[ ]括号的，就是多选，不带的就是单选,所有选项的 开对应true，关对应false，自行根据需要调整
boss:
  debugger: false # 开发者模式，默认为false即可
  openWindows: false # Docker/服务器模式需关闭窗口，启用无头浏览器
  # 【核心修改】更新为更直接、突出技能的打招呼语
  sayHi: "您好，我是一名本科生，对AI和智能体开发有浓厚兴趣，并具备相关项目经验。希望能寻找一份兼职开发工作，为您的团队贡献力量。"
  # 【核心修改】关键词调整为智能体开发、AI工程师、技术栈和兼职/远程岗
  keywords: ["智能体", "AI工程师", "Agent", "LLM", "vibcoding", "后端开发", "兼职", "远程实习"]
  industry: [ "不限" ] # 公司行业，保持不限以扩大范围
  cityCode: [ "全国" ] # 城市：线上兼职为主，选择“全国”
  # 【核心修改】经验要求调整为更符合本科在校生或应届生的范围
  experience: [ "不限", "在校生", "应届生", "1年以内", "1-3年" ]
  jobType: "兼职" # 求职类型，与您的目标一致
  salary: "" # 薪资（单选）：留空以扩大搜索范围
  # 【核心修改】学历已从硕博改为本科
  degree: [ "本科" ]
  scale: [ "不限" ] # 公司规模
  stage: [ "不限" ] # 融资阶段
  # 【核心修改】调整为兼职/实习更实际的薪资范围(3K-10K)，您也可以留空 `[ , ]` 以匹配所有薪资
  expectedSalary: [ 3, 10 ]
  waitTime: 10 # 每投递一个岗位，等待10秒
  filterDeadHR: true # 过滤不活跃HR
  enableAI: true # 开启AI检测与自动生成打招呼语
  interval: 1
  max: 100 # 岗位较少，可以适当增加投递次数以扩大覆盖面
  sendImgResume: false # 是否发送图片简历
  deadStatus: [ "2周内活跃","本月活跃" ] # 只投递近期活跃的HR，提高效率

ai:
  # 【核心修改】AI自我介绍，重写以突出智能体开发经验和实践能力
  introduce: "我是一名应届本科生，对人工智能领域充满热情。我熟练掌握vibcoding，并具备扎实的智能体（Agent）开发经验，能够独立完成从设计到部署的开发流程。我具备快速学习能力和良好的团队协作精神，希望能获得一份兼职机会，将所学应用于实际项目中。"
  # prompt保持通用性，它会动态引用上面的introduce内容
  prompt: "我目前在寻求AI开发与智能体相关的兼职机会,%s,我期望的方向是【%s】,目前我需要投递的职位是【%s】,这个职位的要求是【%s】,如果这个职位和我的技术背景与开发能力基本符合，注意是基本符合，那么请帮我写一个给对方打招呼的文本发给我，如果完全不相干，直接返回false给我，注意只要返回我需要的内容即可，不要有其他的语气助词 , 发送的文字不要太多 , 不要是 markdown 格式,限制在20词内的一段话，重点要突出我的技术栈和项目经验与职位的匹配度，我自己写的招呼语是：【%s】,你可以参照我自己写的根据职位情况进行适当调整"

bot:
  is_send: true #开启企业微信消息推送
  template: |
    ## 新投递成功
    - 岗位：{{jobLink}}
    - 公司：{{companyName}}
    - 城市/经验：{{jobArea}}
    - 薪资：{{salary}}
    - 招呼语：{{greeting}}
    - 状态：{{status}}